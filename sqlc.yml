version: "2"
sql:
- schema: "db/migrations"
  queries: "db/queries"
  engine: "postgresql"
  gen:
    go:
      package: "db"
      out: "internal/db"
      sql_package: "pgx/v5"
      emit_json_tags: true
      overrides:
        - db_type: "uuid"
          go_type: "github.com/google/uuid.UUID"
        - db_type: "timestamptz"
          go_type: "time.Time"
